services:
  # --- UNIFIED AUTOPOST APP (SERVER + CLIENT) ---
  - type: web
    name: flora-engine
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/stats/overview
    envVars:
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ID
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
      - key: SONG_LINKS
        sync: false
      - key: PROXY_URL
        sync: false
      - key: META_BASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: NODE_ENV
        value: production
